<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ギフトボックス アニメーション</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: sans-serif;
    }

    .center-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      padding: 0; /* 余白をなくす */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #box-image {
      max-width: 100%;
      opacity: 1;
      transition: opacity 2s ease;
    }

    #box-image.fade-out {
      opacity: 0;
    }

    #headline,
    #coupon-image,
    #message,
    #timestamp {
      opacity: 0;
      visibility: hidden;
      transition: opacity 2s ease;
    }

    #headline.show,
    #coupon-image.show,
    #message.show,
    #timestamp.show {
      opacity: 1;
      visibility: visible;
    }

    #headline {
      font-size: 1.2em;
      margin-bottom: 15px;
      color: #333;
    }

    #coupon-image {
      max-width: 60%; /* サイズを小さく */
      height: auto; /* 縦横比を維持 */
    }

    #message,
    #timestamp {
      font-size: 0.9em; /* 小さめ */
      margin-top: 12px;
      color: #444;
    }
  </style>
</head>
<body>
  <!-- 最初のギフトボックス表示用エリア -->
  <div id="box-screen" class="center-screen">
    <img id="box-image" src="open_box.gif" alt="ギフトボックス">
  </div>

  <!-- クーポン表示エリア -->
  <div class="container">
    <div id="headline"></div>
    <img id="coupon-image" src="coupon.png" alt="クーポン">
    <div id="message">スマホでこの画面をキャプチャしてお店で見せてね♪</div>
    <div id="timestamp"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const boxScreen = document.getElementById('box-screen');
      const boxImage = document.getElementById('box-image');
      const headline = document.getElementById('headline');
      const couponImage = document.getElementById('coupon-image');
      const message = document.getElementById('message');
      const timestamp = document.getElementById('timestamp');

      // URLパラメータから名前取得（例: ?name=Reina）
      const params = new URLSearchParams(window.location.search);
      const name = params.get("name") || "xxx";
      headline.innerText = `${name}さんからのスペシャルギフト⭐️\n『煮卵おひとつ無料！』`;

      // 現在時刻を yyyy/MM/dd hh:mm 表示
      const now = new Date();
      const pad = (n) => n.toString().padStart(2, '0');
      const formatted = `(${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())} 発行)`;
      timestamp.innerText = formatted;

      // アニメーション
      setTimeout(function () {
        boxImage.classList.add('fade-out');

        setTimeout(function () {
          boxScreen.style.display = 'none'; // 中央表示部分を非表示
          headline.classList.add('show');
          couponImage.classList.add('show');
          message.classList.add('show');
          timestamp.classList.add('show');
        }, 2000);
      }, 3500);
    });
  </script>
</body>
</html>
