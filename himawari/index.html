<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ギフトボックス アニメーション</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: sans-serif;
    }

    .center-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      padding: 0; /* 余白をなくす */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: transparent; /* 初期状態は透明 */
      transition: background-image 2s ease; /* 背景画像のフェードイン */
    }

    .container.show-background {
      background-image: url('background_orange.png'); /* 背景画像を設定 */
      background-size: cover; /* 画像をカバーするように表示 */
      background-position: center; /* 画像を中央に配置 */
    }

    #box-image {
      max-width: 100%;
      opacity: 1;
      transition: opacity 2s ease;
    }

    #box-image.fade-out {
      opacity: 0;
    }

    #headline,
    #coupon-image,
    #message,
    #timestamp {
      opacity: 0;
      visibility: hidden;
      transition: opacity 2s ease;
    }

    #headline.show,
    #coupon-image.show,
    #message.show,
    #timestamp.show {
      opacity: 1;
      visibility: visible;
    }

    #headline {
      font-size: 1.2em;
      margin-bottom: 15px;
      color: #333;
    }

    #coupon-image {
      max-width: 60%; /* サイズを小さく */
      height: auto; /* 縦横比を維持 */
    }

    #message,
    #timestamp {
      font-size: 0.9em; /* 小さめ */
      margin-top: 12px;
      color: #444;
    }
  </style>
</head>
<body>
  <!-- 最初のギフトボックス表示用エリア -->
  <div id="box-screen" class="center-screen">
    <img id="box-image" src="open_box.gif" alt="ギフトボックス">
  </div>

  <!-- クーポン表示エリア -->
  <div class="container">
    <div id="headline"></div>
    <img id="coupon-image" src="coupon.png" alt="クーポン">
    <div id="message">
      スマホでこの画面をスクショ保存して
      <br>
      <a href="https://maps.app.goo.gl/rBqmvKNVe5AchuKM6" target="_blank" rel="noopener noreferrer">お店</a>
      でご提示ください！
    </div>
    <div id="timestamp"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const boxScreen = document.getElementById('box-screen');
      const boxImage = document.getElementById('box-image');
      const headline = document.getElementById('headline');
      const couponImage = document.getElementById('coupon-image');
      const message = document.getElementById('message');
      const timestamp = document.getElementById('timestamp');

      // URLパラメータから名前取得（例: ?name=Reina）
      const params = new URLSearchParams(window.location.search);
      const name = params.get("name") || "xxx";
      const eggImage = '<img src="boiled_egg.png" alt="卵" style="width: 35px; vertical-align: middle;">';
      headline.innerHTML = `<strong><span style="color: #A52A2A;">${name}</span>さんからのスペシャルギフト</strong><br>『${eggImage} 煮卵おひとつ無料！』`;

      // 現在時刻を yyyy/MM/dd hh:mm 表示
      // const now = new Date();
      // const pad = (n) => n.toString().padStart(2, '0');
      // const formatted = `(${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())} 発行)`;
      // timestamp.innerText = formatted;

      // 文言を追加
      timestamp.innerText = "（※お一人様一回限定となります）";

      // アニメーション
      setTimeout(function () {
        boxImage.classList.add('fade-out');

        setTimeout(function () {
          boxScreen.style.display = 'none'; // 中央表示部分を非表示
          headline.classList.add('show');
          couponImage.classList.add('show');
          message.classList.add('show');
          timestamp.classList.add('show');
          document.querySelector('.container').classList.add('show-background'); // 背景色を変更
        }, 2000);
      }, 3500);
    });
  </script>
</body>
</html>
