<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ギフトボックス アニメーション</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #ffffff;
      font-family: sans-serif;
      flex-direction: column;
    }

    .container {
      text-align: center;
    }

    img {
      height: auto;
    }

    #box-image {
      max-width: 100%;
      opacity: 1;
      transition: opacity 2s ease;
    }

    #box-image.fade-out {
      opacity: 0;
    }

    #headline,
    #coupon-image,
    #message,
    #timestamp {
      opacity: 0;
      visibility: hidden;
      transition: opacity 2s ease;
    }

    #headline.show,
    #coupon-image.show,
    #message.show,
    #timestamp.show {
      opacity: 1;
      visibility: visible;
    }

    #headline {
      font-size: 1.2em;
      margin-bottom: 15px;
      color: #333;
    }

    #coupon-image {
      max-width: 80%; /* 少し大きく */
    }

    #message,
    #timestamp {
      font-size: 0.9em; /* 少し小さく */
      margin-top: 12px;
      color: #444;
    }

    button {
      font-size: 1em;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: #ffcc00;
      color: #333;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #ffdd33;
    }
  </style>
</head>
<body>
  <div class="container">
    <img id="box-image" src="open_box.gif" alt="ギフトボックス">
    <div id="headline"></div>
    <img id="coupon-image" src="coupon.png" alt="クーポン">
    <div id="message">スマホでこの画面をキャプチャして、お店で見せてね♪</div>
    <div id="timestamp"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const boxImage = document.getElementById('box-image');
      const headline = document.getElementById('headline');
      const couponImage = document.getElementById('coupon-image');
      const message = document.getElementById('message');
      const timestamp = document.getElementById('timestamp');

      // URLパラメータから名前取得（例: ?name=Reina）
      const params = new URLSearchParams(window.location.search);
      const name = params.get("name") || "Reina";
      headline.innerText = `${name}さんからのスペシャルギフト⭐️\n『煮卵おひとつ無料！』`;

      // 現在時刻を yyyy/MM/dd hh:mm 形式で表示
      const now = new Date();
      const pad = (n) => n.toString().padStart(2, '0');
      const formatted = "(" + `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}` + ")";
      timestamp.innerText = formatted;

      // アニメーション開始
      setTimeout(function () {
        boxImage.classList.add('fade-out');

        setTimeout(function () {
          boxImage.style.display = 'none';
          headline.classList.add('show');
          couponImage.classList.add('show');
          message.classList.add('show');
          timestamp.classList.add('show');
        }, 2000);
      }, 3500);
    });
  </script>
</body>
</html>
