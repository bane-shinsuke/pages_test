<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>プレゼント開封アニメーション</title>
  <style>
    /* ページ全体を上下左右中央に配置 */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* コンテナは画面全体の高さを持たせ、内部は中央揃え */
    #container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      height: 100vh; /* 画面全体の高さ */
    }
    /* GIF画像のスタイル */
    #openBox {
      display: block;
      max-width: 90%;
      margin: 0 auto;
    }
    /* クーポン画像のスタイル（大きく表示） */
    #couponImage {
      display: block;
      width: 80%;
      max-width: 800px;
      margin: 20px auto 0;
      opacity: 0;
      transition: opacity 1s ease-in;
    }
    /* メッセージのスタイル */
    #message {
      margin-top: 20px;
      font-size: 1.2em;
      color: #333;
      opacity: 0;
      transition: opacity 1s ease-in;
    }
  </style>
</head>
<body>
  <div id="container">
    <!-- 開封中のGIF画像 -->
    <img id="openBox" src="open_box.gif" alt="プレゼント開封中">
    <!-- GIFアニメーション終了後に表示するクーポン画像 -->
    <img id="couponImage" src="coupon.png" alt="クーポン画像">
    <!-- クーポン画像下部に表示するメッセージ -->
    <div id="message">この画面をキャプチャして、お店で見せてね♪</div>
  </div>

  <script>
    // open_box.gif のアニメーション時間（ミリ秒単位：5秒）
    const gifDuration = 5000;

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        // GIF画像を非表示にし、クーポン画像をフェードイン
        document.getElementById('openBox').style.display = 'none';
        document.getElementById('couponImage').style.opacity = 1;

        // クーポン画像表示後、1秒後にメッセージをフェードイン
        setTimeout(() => {
          document.getElementById('message').style.opacity = 1;
        }, 1000);
      }, gifDuration);
    });
  </script>
</body>
</html>
