<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特別クーポン</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f5f5f5;
            font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
        }
        
        .container {
            text-align: center;
        }
        
        #gift-box {
            max-width: 300px;
        }
        
        #coupon-image {
            max-width: 300px;
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }
        
        #message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #e74c3c;
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }
    </style>
</head>
<body>
    <div class="container">
        <img id="gift-box" src="open_box.gif" alt="ギフトボックスが開きます">
        <img id="coupon-image" src="coupon.png" alt="特別クーポン">
        <div id="message">この画面をキャプチャして、お店で見せてね♪</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const giftBox = document.getElementById('gift-box');
            const couponImage = document.getElementById('coupon-image');
            const message = document.getElementById('message');
            
            // アニメーションのおおよその長さを設定（GIFの長さに応じて調整）
            const animationDuration = 3000; // 3秒（GIFの長さに合わせて調整）
            
            // アニメーション完了後にクーポンを表示
            setTimeout(() => {
                // クーポン画像をフェードイン
                couponImage.style.opacity = '1';
                
                // 少し遅れてメッセージをフェードイン
                setTimeout(() => {
                    message.style.opacity = '1';
                }, 500);
                
                // アニメーションが終わったらgiftBoxを非表示
                giftBox.style.display = 'none';
            }, animationDuration);
        });
    </script>
</body>
</html>
