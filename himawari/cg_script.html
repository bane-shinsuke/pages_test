<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>プレゼントボックスのアニメーション</title>
  <style>
    /* ページ全体の設定 */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #fefefe;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* プレゼントボックスのコンテナ */
    #box-container {
      position: relative;
      width: 150px;
      height: 150px;
    }

    /* ボックスの下部 */
    .box-base {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: #f66;
      border-radius: 10px;
      box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
    }

    /* ボックスのフタ */
    .box-lid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 30px;
      background-color: #f33;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      transform-origin: center bottom;
      transform: perspective(300px) rotateX(0deg);
      transition: transform 1s ease;
    }

    /* フタが開いたときのクラス */
    .open-lid {
      transform: perspective(300px) rotateX(-90deg);
    }

    /* 開封後に画像が表示されるための設定 */
    #coupon-image {
      max-width: 80%;
      height: auto;
      display: none; /* 初期表示は非表示 */
      transition: opacity 1s ease;
      opacity: 0;
    }
    #coupon-image.show {
      display: block;
      opacity: 1;
    }
  </style>
</head>
<body>
  <!-- プレゼントボックス -->
  <div id="box-container">
    <div class="box-lid" id="box-lid"></div>
    <div class="box-base"></div>
  </div>

  <!-- 開封後に表示したい画像 (パスを正しく設定) -->
  <img id="coupon-image" src="coupon.png" alt="クーポン画像">

  <script>
    // ページ読み込み後に自動でフタが開くようにする
    window.addEventListener('DOMContentLoaded', () => {
      const boxLid = document.getElementById('box-lid');
      const couponImage = document.getElementById('coupon-image');

      // 2秒後にフタを開く
      setTimeout(() => {
        boxLid.classList.add('open-lid');
      }, 2000);

      // フタが開いた後、さらに1.5秒後にボックスを消して画像を表示
      setTimeout(() => {
        // ボックスコンテナを非表示にする
        document.getElementById('box-container').style.display = 'none';
        // 画像をフェードイン表示
        couponImage.classList.add('show');
      }, 3500);
    });
  </script>
</body>
</html>
